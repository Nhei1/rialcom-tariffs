[project]
name = "rialcom-tariffs"
version = "1.0.0"
description = "Парсер интернет-тарифов RialCom с выгрузкой в Excel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.31,<3.0)",
    "urllib3 (>=1.26,<3.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "openpyxl (>=3.1,<4.0)",
]

[project.scripts]
rialcom-tariffs = "rialcom_tariffs.cli:main"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001–RUF003 считают кириллицу «похожей на латиницу» — для русских строк это ложные срабатывания.
ignore = ["RUF001", "RUF002", "RUF003"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
